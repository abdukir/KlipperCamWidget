name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # Releases must use the permanent key, or users can't install updates over them.
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::KEYSTORE_BASE64 secret is missing; refusing to publish a release signed with a throwaway key"
              exit 1
            fi
            echo "No signing key configured; release APKs are signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build, test and lint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        # Artifacts are a convenience; a failed upload must not block publishing a release.
        continue-on-error: true
        with:
          name: apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/app-universal-debug.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
